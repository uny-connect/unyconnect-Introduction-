<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유니 커넥트(UNY CONNECT) | 회사소개서</title>
  
  <meta property="og:title" content="유니 커넥트(UNY CONNECT) 회사소개서">
  <meta property="og:description" content="한·일 비즈니스를 잇는 가장 확실한 로컬 커넥터">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    body { font-family: 'Pretendard', sans-serif; }
    .sidebar-scroll::-webkit-scrollbar { width: 5px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #52525b; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#18181b] text-gray-100 h-screen w-screen overflow-hidden flex flex-col">

  <!-- 상단 헤더 / 네비게이션 -->
  <header class="h-14 bg-[#27272a] border-b border-[#3f3f46] px-4 flex items-center justify-between z-20 flex-shrink-0">
    <div class="flex items-center gap-3">
      <span class="font-extrabold text-lg tracking-tight text-white">UNY <span class="text-[#FF5A1F]">CONNECT</span></span>
      <span class="text-xs bg-[#3f3f46] text-gray-300 px-2 py-0.5 rounded">회사소개서 2026</span>
    </div>

    <!-- 페이지 이동 컨트롤 -->
    <div class="flex items-center gap-2">
      <button onclick="prevSlide()" class="p-1.5 rounded hover:bg-[#3f3f46] text-gray-300 hover:text-white transition">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <span id="page-num" class="text-sm font-semibold text-white tracking-widest min-w-[60px] text-center">1 / 12</span>
      <button onclick="nextSlide()" class="p-1.5 rounded hover:bg-[#3f3f46] text-gray-300 hover:text-white transition">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- 우측 여백 -->
    <div class="w-12"></div>
  </header>

  <!-- 메인 영역 -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- 좌측 슬라이드 썸네일 리스트 -->
    <aside class="w-64 bg-[#202023] border-r border-[#3f3f46] overflow-y-auto sidebar-scroll hidden md:flex flex-col p-3 gap-3 flex-shrink-0">
      <div class="text-xs font-bold text-gray-400 px-1 py-1 uppercase tracking-wider">Index & Slides</div>
      <div id="thumbnail-container" class="flex flex-col gap-3"></div>
    </aside>

    <!-- 우측 메인 뷰어 -->
    <main class="flex-1 bg-[#121214] relative flex items-center justify-center p-3 md:p-6 overflow-hidden select-none" id="main-viewer">
      
      <!-- 이전 버튼 -->
      <button onclick="prevSlide()" class="absolute left-4 z-10 w-12 h-12 rounded-full bg-black/50 hover:bg-black/80 text-white flex items-center justify-center transition backdrop-blur-sm shadow-lg">
        <i data-lucide="chevron-left" class="w-7 h-7"></i>
      </button>

      <!-- 슬라이드 메인 이미지 프레임 및 클릭 링크 영역 -->
      <div class="relative w-full h-full max-w-[1400px] max-h-[850px] flex items-center justify-center">
        <img id="main-slide-img" src="slide-1.png" alt="슬라이드 1" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl transition duration-150">
        
        <!-- 슬라이드 5번용: 크리에이터 확인하기 투명 링크 영역 -->
        <a id="link-slide-5" href="https://lrl.kr/e3cyS" target="_blank" 
           class="hidden absolute z-20 cursor-pointer rounded border border-transparent hover:border-[#FF5A1F]/50 hover:bg-[#FF5A1F]/10 transition"
           style="left: 10%; top: 40%; width: 28%; height: 7%;" title="크리에이터 확인하기 새창열기"></a>

        <!-- 슬라이드 7번용: 북마크 크리에이터즈 플랫폼 확인하기 투명 링크 영역 -->
        <a id="link-slide-7" href="https://bookmarkjp.com/bookmarkcreators" target="_blank" 
           class="hidden absolute z-20 cursor-pointer rounded-full border border-transparent hover:border-[#FF5A1F]/50 hover:bg-[#FF5A1F]/10 transition"
           style="left: 35%; bottom: 10%; width: 30%; height: 8%;" title="플랫폼 확인하기 새창열기"></a>
      </div>

      <!-- 다음 버튼 -->
      <button onclick="nextSlide()" class="absolute right-4 z-10 w-12 h-12 rounded-full bg-black/50 hover:bg-black/80 text-white flex items-center justify-center transition backdrop-blur-sm shadow-lg">
        <i data-lucide="chevron-right" class="w-7 h-7"></i>
      </button>

      <!-- 하단 플로팅 바: 문의하기 팝업 버튼 -->
      <div class="absolute bottom-5 z-10">
        <button onclick="openModal()" class="flex items-center gap-2 bg-[#FF5A1F] hover:bg-[#e04a14] text-white text-xs md:text-sm font-bold px-6 py-2.5 rounded-full shadow-2xl transition transform hover:scale-105">
          <i data-lucide="mail" class="w-4 h-4"></i> 문의하기
        </button>
      </div>
    </main>
  </div>

  <!-- 문의하기 팝업 모달 -->
  <div id="contact-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-[#242427] border border-[#3f3f46] rounded-2xl w-full max-w-md p-6 relative shadow-2xl text-gray-100">
      
      <!-- 닫기 버튼 -->
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="mb-5">
        <span class="text-[#FF5A1F] font-bold text-xs uppercase tracking-wider block mb-1">INQUIRY</span>
        <h3 class="text-xl font-bold text-white">비즈니스 제휴 및 문의</h3>
        <p class="text-xs text-gray-400 mt-1">문의 내용을 남겨주시면 담당자가 신속히 연락드립니다.</p>
      </div>

      <form onsubmit="handleInquirySubmit(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">회사명 / 브랜드명 <span class="text-[#FF5A1F]">*</span></label>
          <input type="text" id="company" required placeholder="예: 유니 컴퍼니" class="w-full bg-[#18181b] border border-[#3f3f46] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FF5A1F]">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">담당자명 <span class="text-[#FF5A1F]">*</span></label>
            <input type="text" id="name" required placeholder="홍길동" class="w-full bg-[#18181b] border border-[#3f3f46] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FF5A1F]">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">연락처 <span class="text-[#FF5A1F]">*</span></label>
            <input type="tel" id="phone" required placeholder="010-0000-0000" class="w-full bg-[#18181b] border border-[#3f3f46] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FF5A1F]">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">이메일 <span class="text-[#FF5A1F]">*</span></label>
          <input type="email" id="email" required placeholder="name@company.com" class="w-full bg-[#18181b] border border-[#3f3f46] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FF5A1F]">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">문의 내용 <span class="text-[#FF5A1F]">*</span></label>
          <textarea id="message" rows="3" required placeholder="협업 희망 내용, 일정 등을 간략히 적어주세요." class="w-full bg-[#18181b] border border-[#3f3f46] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FF5A1F] resize-none"></textarea>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-[#FF5A1F] hover:bg-[#e04a14] text-white font-bold py-2.5 rounded-lg text-sm transition mt-2 shadow-lg">
          문의 내용 전달하기
        </button>
      </form>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzlalBPNY7TglmfD4CFt3-CCS6eqKiuEGzE5J8QUjHX1695a7l2tQKNTpIDTxMLFSzNg/exec";

    const totalSlides = 12;
    let currentIndex = 1;

    const titles = [
      "01 표지",
      "02 ABOUT UNY CONNECT",
      "03 실적 & 지표",
      "04 4대 사업 포트폴리오",
      "05 01. MCN 에이전시",
      "06 02. 일본 현지 팸투어",
      "07 03. 크리에이터즈 플랫폼",
      "08 04. 박람회 총괄 운영",
      "09 Case 01: F&B 팸투어",
      "10 Case 02: 트래블쇼 박람회",
      "11 유니커넥트 차별화 경쟁력",
      "12 Contact & 파트너십"
    ];

    // 좌측 썸네일 동적 생성
    const thumbContainer = document.getElementById("thumbnail-container");
    for (let i = 1; i <= totalSlides; i++) {
      const card = document.createElement("div");
      card.id = `thumb-${i}`;
      card.className = `cursor-pointer rounded-lg p-2 border transition duration-150 ${i === 1 ? 'border-[#FF5A1F] bg-[#2a2a2e]' : 'border-[#3f3f46] bg-[#27272a] hover:border-gray-500'}`;
      card.onclick = () => goToSlide(i);

      card.innerHTML = `
        <div class="text-[11px] font-bold text-gray-300 mb-1 flex justify-between">
          <span>${titles[i - 1] || 'Slide ' + i}</span>
          <span class="text-gray-500 font-normal">${i}</span>
        </div>
        <div class="aspect-[16/9] w-full rounded overflow-hidden bg-black/50">
          <img src="slide-${i}.png" alt="썸네일 ${i}" class="w-full h-full object-cover">
        </div>
      `;
      thumbContainer.appendChild(card);
    }

    // 슬라이드 이동 제어
    function goToSlide(index) {
      if (index < 1 || index > totalSlides) return;
      
      const oldThumb = document.getElementById(`thumb-${currentIndex}`);
      if (oldThumb) {
        oldThumb.className = "cursor-pointer rounded-lg p-2 border border-[#3f3f46] bg-[#27272a] hover:border-gray-500 transition duration-150";
      }

      currentIndex = index;

      const mainImg = document.getElementById("main-slide-img");
      mainImg.src = `slide-${currentIndex}.png`;
      mainImg.alt = `슬라이드 ${currentIndex}`;
      document.getElementById("page-num").innerText = `${currentIndex} / ${totalSlides}`;

      // 5번, 7번 슬라이드 링크 레이어 토글
      const link5 = document.getElementById("link-slide-5");
      const link7 = document.getElementById("link-slide-7");
      if (currentIndex === 5) { link5.classList.remove("hidden"); } else { link5.classList.add("hidden"); }
      if (currentIndex === 7) { link7.classList.remove("hidden"); } else { link7.classList.add("hidden"); }

      const newThumb = document.getElementById(`thumb-${currentIndex}`);
      if (newThumb) {
        newThumb.className = "cursor-pointer rounded-lg p-2 border border-[#FF5A1F] bg-[#2a2a2e] transition duration-150";
        newThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function prevSlide() {
      if (currentIndex > 1) goToSlide(currentIndex - 1);
    }

    function nextSlide() {
      if (currentIndex < totalSlides) goToSlide(currentIndex + 1);
    }

    // 마우스 휠 스크롤 제어
    let isWheeling = false;
    window.addEventListener("wheel", (e) => {
      if (!document.getElementById("contact-modal").classList.contains("hidden")) return;
      if (e.target.closest("aside")) return;

      if (isWheeling) return;
      isWheeling = true;

      if (e.deltaY > 20) {
        nextSlide();
      } else if (e.deltaY < -20) {
        prevSlide();
      }

      setTimeout(() => { isWheeling = false; }, 300);
    }, { passive: true });

    // 키보드 방향키 제어
    window.addEventListener("keydown", (e) => {
      if (!document.getElementById("contact-modal").classList.contains("hidden")) return;
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") prevSlide();
      if (e.key === "ArrowRight" || e.key === "ArrowDown") nextSlide();
    });

    // 모바일 터치 스와이프 제어
    let touchStartX = 0;
    const viewer = document.getElementById("main-viewer");
    viewer.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
    viewer.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      if (touchStartX - touchEndX > 50) nextSlide();
      if (touchEndX - touchStartX > 50) prevSlide();
    }, { passive: true });

    // 모달 제어
    function openModal() {
      document.getElementById("contact-modal").classList.remove("hidden");
    }
    function closeModal() {
      document.getElementById("contact-modal").classList.add("hidden");
    }

    // 구글 시트 연동 전송 처리
    function handleInquirySubmit(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById("submit-btn");
      const originalText = submitBtn.innerText;
      
      submitBtn.disabled = true;
      submitBtn.innerText = "전송 중...";

      const payload = {
        source: "회사소개서 뷰어", // 유입 출처 자동 표기
        company: document.getElementById("company").value,
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(response => {
        alert("문의 내용이 안전하게 접수되었습니다. 담당자가 확인 후 빠른 시일 내에 연락드리겠습니다.");
        e.target.reset();
        closeModal();
      })
      .catch(err => {
        alert("문의가 정상 접수되었습니다. 확인 후 신속히 안내해 드리겠습니다.");
        e.target.reset();
        closeModal();
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      });
    }

    lucide.createIcons();
  </script>
</body>
</html>
