<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>유니 커넥트(UNY CONNECT) | 회사소개서</title>
  
  <meta property="og:title" content="유니 커넥트(UNY CONNECT) 회사소개서">
  <meta property="og:description" content="한·일 비즈니스를 잇는 가장 확실한 로컬 커넥터">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    body { font-family: 'Pretendard', sans-serif; }
    .sidebar-scroll::-webkit-scrollbar { width: 5px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #52525b; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#141416] text-gray-100 h-screen w-screen overflow-hidden flex flex-col">

  <!-- 1. 상단 헤더: 모바일에서는 로고만 깔끔하게 표시 -->
  <header class="h-12 md:h-14 bg-[#1f1f23] border-b border-[#2d2d32] px-4 flex items-center justify-between z-20 flex-shrink-0">
    <div class="flex items-center gap-2">
      <span class="font-extrabold text-base md:text-lg tracking-tight text-white">UNY <span class="text-[#FF5A1F]">CONNECT</span></span>
      <span class="hidden md:inline-block text-xs bg-[#2d2d32] text-gray-300 px-2 py-0.5 rounded">회사소개서 2026</span>
    </div>

    <!-- 데스크톱용 상단 페이지 이동 컨트롤러 -->
    <div class="hidden md:flex items-center gap-2">
      <button onclick="prevSlide()" class="p-1.5 rounded hover:bg-[#2d2d32] text-gray-300 hover:text-white transition">
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <span id="page-num-desktop" class="text-sm font-semibold text-white tracking-widest min-w-[60px] text-center">1 / 12</span>
      <button onclick="nextSlide()" class="p-1.5 rounded hover:bg-[#2d2d32] text-gray-300 hover:text-white transition">
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- 우측 여백 (데스크톱 균형용) -->
    <div class="w-8 hidden md:block"></div>
  </header>

  <!-- 2. 메인 뷰어 영역 -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- 좌측 슬라이드 썸네일 리스트 (PC 전용) -->
    <aside class="w-64 bg-[#1a1a1d] border-r border-[#2d2d32] overflow-y-auto sidebar-scroll hidden md:flex flex-col p-3 gap-3 flex-shrink-0">
      <div class="text-xs font-bold text-gray-400 px-1 py-1 uppercase tracking-wider">Index & Slides</div>
      <div id="thumbnail-container" class="flex flex-col gap-3"></div>
    </aside>

    <!-- 우측 메인 뷰어 (PC & 모바일 반응형) -->
    <main class="flex-1 relative flex flex-col items-center justify-center p-3 md:p-6 overflow-hidden select-none" id="main-viewer">
      
      <!-- PC 전용 좌우 플로팅 이전/다음 버튼 -->
      <button onclick="prevSlide()" class="hidden md:flex absolute left-4 z-10 w-12 h-12 rounded-full bg-black/50 hover:bg-black/80 text-white items-center justify-center transition backdrop-blur-sm shadow-lg">
        <i data-lucide="chevron-left" class="w-7 h-7"></i>
      </button>

<!-- 슬라이드 메인 이미지 프레임 및 클릭 링크 영역 -->
      <div class="relative w-full max-w-[1400px] flex-1 md:h-full max-h-[820px] flex items-center justify-center">
        <!-- 16:9 비율 고정 래퍼 (화면 크기가 달라져도 글자 위치에 고정) -->
        <div class="relative inline-flex items-center justify-center max-w-full max-h-full aspect-[16/9]">
          <img id="main-slide-img" src="slide-1.png" alt="슬라이드 1" class="w-full h-full object-contain rounded-xl shadow-2xl transition duration-150">
          
<!-- 슬라이드 5번: '크리에이터 확인하기 ↗' 텍스트를 정확히 덮는 위치 -->
          <a id="link-slide-5" href="https://lrl.kr/e3cyS" target="_blank" 
             class="hidden absolute z-20 cursor-pointer rounded border border-transparent hover:border-[#FF5A1F] hover:bg-[#FF5A1F]/15 transition"
             style="left: 8.3%; top: 46.2%; width: 12.5%; height: 3.2%;" title="크리에이터 확인하기 새창열기"></a>

          <!-- 슬라이드 7번: ''북마크 크리에이터즈' 플랫폼 확인하기 ↗' 텍스트를 정확히 덮는 위치 -->
          <a id="link-slide-7" href="https://bookmarkjp.com/bookmarkcreators" target="_blank" 
             class="hidden absolute z-20 cursor-pointer rounded border border-transparent hover:border-[#FF5A1F] hover:bg-[#FF5A1F]/15 transition"
             style="left: 8.8%; top: 79.5%; width: 21.5%; height: 3.6%;" title="플랫폼 확인하기 새창열기"></a>
        </div>
      </div>

      <button onclick="nextSlide()" class="hidden md:flex absolute right-4 z-10 w-12 h-12 rounded-full bg-black/50 hover:bg-black/80 text-white items-center justify-center transition backdrop-blur-sm shadow-lg">
        <i data-lucide="chevron-right" class="w-7 h-7"></i>
      </button>

      <!-- 3. 모바일 전용 하단 컨트롤러 바 (주말토리 스타일) -->
      <div class="w-full flex flex-col items-center gap-3 pt-3 pb-2 md:hidden flex-shrink-0 z-20">
        <!-- 모바일 페이지 이동 버튼 -->
        <div class="flex items-center gap-4 bg-[#232328] px-4 py-1.5 rounded-full border border-[#323238] shadow-md">
          <button onclick="prevSlide()" class="w-8 h-8 rounded-full bg-[#2d2d33] active:bg-[#3f3f46] text-white flex items-center justify-center">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
          <span id="page-num-mobile" class="text-sm font-bold text-gray-200 tracking-wider min-w-[55px] text-center">1 / 12</span>
          <button onclick="nextSlide()" class="w-8 h-8 rounded-full bg-[#2d2d33] active:bg-[#3f3f46] text-white flex items-center justify-center">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- 모바일 문의하기 버튼 -->
        <button onclick="openModal()" class="w-full max-w-[280px] bg-[#FF5A1F] active:bg-[#e04a14] text-white font-bold py-2.5 rounded-full text-sm shadow-xl flex items-center justify-center gap-2">
          <i data-lucide="mail" class="w-4 h-4"></i> 문의하기
        </button>
      </div>

      <!-- 데스크톱용 하단 플로팅 문의하기 버튼 -->
      <div class="hidden md:block absolute bottom-5 z-10">
        <button onclick="openModal()" class="flex items-center gap-2 bg-[#FF5A1F] hover:bg-[#e04a14] text-white text-sm font-bold px-7 py-2.5 rounded-full shadow-2xl transition transform hover:scale-105">
          <i data-lucide="mail" class="w-4 h-4"></i> 문의하기
        </button>
      </div>
    </main>
  </div>

  <!-- 문의하기 모달 -->
  <div id="contact-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-[#242427] border border-[#3f3f46] rounded-2xl w-full max-w-md p-6 relative shadow-2xl text-gray-100">
      
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="mb-5">
        <span class="text-[#FF5A1F] font-bold text-xs uppercase tracking-wider block mb-1">INQUIRY</span>
        <h3 class="text-xl font-bold text-white">비즈니스 제휴 및 문의</h3>
        <p class="text-xs text-gray-400 mt-1">문의 내용을 남겨주시면 담당자가 신속히 연락드립니다.</p>
      </div>

      <form onsubmit="handleInquirySubmit(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">회사명 / 브랜드명 <span class="text-[#FF5A1F]">*</span></label>
          <input type="text" id="company" required placeholder="예: 유니 컴퍼니" class="w-full bg-[#18181b] border border-[#3f3f46] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FF5A1F]">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">담당자명 <span class="text-[#FF5A1F]">*</span></label>
            <input type="text" id="name" required placeholder="홍길동" class="w-full bg-[#18181b] border border-[#3f3f46] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FF5A1F]">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">연락처 <span class="text-[#FF5A1F]">*</span></label>
            <input type="tel" id="phone" required placeholder="010-0000-0000" class="w-full bg-[#18181b] border border-[#3f3f46] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FF5A1F]">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">이메일 <span class="text-[#FF5A1F]">*</span></label>
          <input type="email" id="email" required placeholder="name@company.com" class="w-full bg-[#18181b] border border-[#3f3f46] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FF5A1F]">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">문의 내용 <span class="text-[#FF5A1F]">*</span></label>
          <textarea id="message" rows="3" required placeholder="협업 희망 내용, 일정 등을 간략히 적어주세요." class="w-full bg-[#18181b] border border-[#3f3f46] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-[#FF5A1F] resize-none"></textarea>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-[#FF5A1F] hover:bg-[#e04a14] text-white font-bold py-2.5 rounded-lg text-sm transition mt-2 shadow-lg">
          문의 내용 전달하기
        </button>
      </form>
    </div>
  </div>

  <!-- 접수 완료 커스텀 모달 -->
  <div id="success-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-[#242427] border border-[#3f3f46] rounded-2xl w-full max-w-sm p-6 text-center shadow-2xl relative">
      <div class="w-14 h-14 bg-[#FF5A1F]/15 text-[#FF5A1F] rounded-full flex items-center justify-center mx-auto mb-4 border border-[#FF5A1F]/30">
        <i data-lucide="check" class="w-8 h-8 stroke-[2.5]"></i>
      </div>
      <h4 class="text-lg font-bold text-white mb-2">문의가 안전하게 접수되었습니다</h4>
      <p class="text-xs text-gray-300 leading-relaxed mb-6">
        남겨주신 문의 내용을 확인한 후,<br>담당자가 신속하게 연락드리겠습니다.
      </p>
      <button onclick="closeSuccessModal()" class="w-full bg-[#FF5A1F] hover:bg-[#e04a14] text-white font-bold py-2.5 rounded-xl text-sm transition shadow-lg">
        확인
      </button>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzlalBPNY7TglmfD4CFt3-CCS6eqKiuEGzE5J8QUjHX1695a7l2tQKNTpIDTxMLFSzNg/exec";

    const totalSlides = 12;
    let currentIndex = 1;

    const titles = [
      "01 표지",
      "02 ABOUT UNY CONNECT",
      "03 실적 & 지표",
      "04 4대 사업 포트폴리오",
      "05 01. MCN 에이전시",
      "06 02. 일본 현지 팸투어",
      "07 03. 크리에이터즈 플랫폼",
      "08 04. 박람회 총괄 운영",
      "09 Case 01: F&B 팸투어",
      "10 Case 02: 트래블쇼 박람회",
      "11 유니커넥트 차별화 경쟁력",
      "12 Contact & 파트너십"
    ];

    // 좌측 썸네일 동적 생성 (PC)
    const thumbContainer = document.getElementById("thumbnail-container");
    for (let i = 1; i <= totalSlides; i++) {
      const card = document.createElement("div");
      card.id = `thumb-${i}`;
      card.className = `cursor-pointer rounded-lg p-2 border transition duration-150 ${i === 1 ? 'border-[#FF5A1F] bg-[#2a2a2e]' : 'border-[#3f3f46] bg-[#27272a] hover:border-gray-500'}`;
      card.onclick = () => goToSlide(i);

      card.innerHTML = `
        <div class="text-[11px] font-bold text-gray-300 mb-1 flex justify-between">
          <span>${titles[i - 1] || 'Slide ' + i}</span>
          <span class="text-gray-500 font-normal">${i}</span>
        </div>
        <div class="aspect-[16/9] w-full rounded overflow-hidden bg-black/50">
          <img src="slide-${i}.png" alt="썸네일 ${i}" class="w-full h-full object-cover">
        </div>
      `;
      thumbContainer.appendChild(card);
    }

    // 슬라이드 이동 제어
    function goToSlide(index) {
      if (index < 1 || index > totalSlides) return;
      
      const oldThumb = document.getElementById(`thumb-${currentIndex}`);
      if (oldThumb) {
        oldThumb.className = "cursor-pointer rounded-lg p-2 border border-[#3f3f46] bg-[#27272a] hover:border-gray-500 transition duration-150";
      }

      currentIndex = index;

      const mainImg = document.getElementById("main-slide-img");
      mainImg.src = `slide-${currentIndex}.png`;
      mainImg.alt = `슬라이드 ${currentIndex}`;
      
      // PC 및 모바일 페이지 텍스트 동기화
      document.getElementById("page-num-desktop").innerText = `${currentIndex} / ${totalSlides}`;
      document.getElementById("page-num-mobile").innerText = `${currentIndex} / ${totalSlides}`;

      // 5번, 7번 슬라이드 링크 레이어 토글
      const link5 = document.getElementById("link-slide-5");
      const link7 = document.getElementById("link-slide-7");
      if (currentIndex === 5) { link5.classList.remove("hidden"); } else { link5.classList.add("hidden"); }
      if (currentIndex === 7) { link7.classList.remove("hidden"); } else { link7.classList.add("hidden"); }

      const newThumb = document.getElementById(`thumb-${currentIndex}`);
      if (newThumb) {
        newThumb.className = "cursor-pointer rounded-lg p-2 border border-[#FF5A1F] bg-[#2a2a2e] transition duration-150";
        newThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function prevSlide() {
      if (currentIndex > 1) goToSlide(currentIndex - 1);
    }

    function nextSlide() {
      if (currentIndex < totalSlides) goToSlide(currentIndex + 1);
    }

    // 마우스 휠 스크롤 제어
    let isWheeling = false;
    window.addEventListener("wheel", (e) => {
      const isInputOpen = !document.getElementById("contact-modal").classList.contains("hidden");
      const isSuccessOpen = !document.getElementById("success-modal").classList.contains("hidden");
      if (isInputOpen || isSuccessOpen) return;
      if (e.target.closest("aside")) return;

      if (isWheeling) return;
      isWheeling = true;

      if (e.deltaY > 20) {
        nextSlide();
      } else if (e.deltaY < -20) {
        prevSlide();
      }

      setTimeout(() => { isWheeling = false; }, 300);
    }, { passive: true });

    // 키보드 방향키 제어
    window.addEventListener("keydown", (e) => {
      const isInputOpen = !document.getElementById("contact-modal").classList.contains("hidden");
      const isSuccessOpen = !document.getElementById("success-modal").classList.contains("hidden");
      if (isInputOpen || isSuccessOpen) return;
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") prevSlide();
      if (e.key === "ArrowRight" || e.key === "ArrowDown") nextSlide();
    });

    // 모바일 터치 스와이프 제어
    let touchStartX = 0;
    const viewer = document.getElementById("main-viewer");
    viewer.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
    viewer.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      if (touchStartX - touchEndX > 45) nextSlide();
      if (touchEndX - touchStartX > 45) prevSlide();
    }, { passive: true });

    // 모달 제어 함수
    function openModal() {
      document.getElementById("contact-modal").classList.remove("hidden");
    }
    function closeModal() {
      document.getElementById("contact-modal").classList.add("hidden");
    }

    function openSuccessModal() {
      document.getElementById("success-modal").classList.remove("hidden");
    }
    function closeSuccessModal() {
      document.getElementById("success-modal").classList.add("hidden");
    }

    // 구글 시트 연동 전송 처리 (no-cors 적용)
    function handleInquirySubmit(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById("submit-btn");
      const originalText = submitBtn.innerText;
      
      submitBtn.disabled = true;
      submitBtn.innerText = "전송 중...";

      const payload = {
        source: "회사소개서 뷰어",
        company: document.getElementById("company").value,
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        e.target.reset();
        closeModal();
        openSuccessModal();
      })
      .catch(err => {
        e.target.reset();
        closeModal();
        openSuccessModal();
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      });
    }

    lucide.createIcons();
  </script>
</body>
</html>
